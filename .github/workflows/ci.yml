name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build production frontend
        run: npm run build

  promote-production:
    name: Mark commit ready for production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Advance production branch to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/git/refs" \
            -f ref="refs/heads/production" \
            -f sha="${COMMIT_SHA}" \
          || gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/git/refs/heads/production" \
            -f sha="${COMMIT_SHA}" \
            -F force=false
